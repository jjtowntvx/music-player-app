<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Music Player</title>
  <style>
    :root {
      --bg: #0f172a;
      --panel: #111827;
      --panel-2: #1f2937;
      --primary: #8b5cf6;
      --primary-2: #a78bfa;
      --text: #e5e7eb;
      --muted: #94a3b8;
      --success: #34d399;
      --danger: #f87171;
      --warning: #fbbf24;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, var(--bg), #1e293b);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .app {
      width: min(1200px, 100%);
      background: rgba(17, 24, 39, 0.9);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 20px 60px rgba(0,0,0,0.35);
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 18px 22px;
      background: rgba(15, 23, 42, 0.9);
      border-bottom: 1px solid rgba(255,255,255,0.08);
    }

    .title {
      font-size: 1.4rem;
      font-weight: 700;
    }

    .upload-wrap {
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
    }

    .btn, .file-btn {
      border: none;
      border-radius: 10px;
      background: var(--primary);
      color: white;
      padding: 10px 16px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.2s ease;
    }

    .btn:hover, .file-btn:hover {
      background: var(--primary-2);
    }

    .btn.secondary {
      background: var(--panel-2);
      color: var(--text);
    }

    .btn.toggle-on {
      background: var(--success);
    }

    .btn.danger {
      background: var(--danger);
    }

    .layout {
      display: grid;
      grid-template-columns: 1.4fr 0.8fr;
      min-height: 700px;
    }

    .main-panel {
      border-right: 1px solid rgba(255,255,255,0.08);
      padding: 20px;
    }

    .player-card {
      background: rgba(31, 41, 55, 0.7);
      border-radius: 18px;
      padding: 22px;
      margin-bottom: 18px;
      border: 1px solid rgba(255,255,255,0.06);
    }

    .cover {
      width: 100%;
      max-width: 260px;
      aspect-ratio: 1;
      margin: 0 auto 18px;
      border-radius: 18px;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, #312e81, #8b5cf6);
      color: white;
      font-size: 3rem;
      box-shadow: inset 0 0 30px rgba(255,255,255,0.12);
    }

    .song-title {
      text-align: center;
      font-size: clamp(1.3rem, 2vw, 2rem);
      margin-bottom: 6px;
      font-weight: 700;
    }

    .song-sub {
      text-align: center;
      color: var(--muted);
      margin-bottom: 18px;
      min-height: 22px;
    }

    .progress-wrap {
      margin: 18px 0 14px;
    }

    .time-row {
      display: flex;
      justify-content: space-between;
      color: var(--muted);
      font-size: 0.9rem;
      margin-bottom: 8px;
    }

    input[type="range"] {
      width: 100%;
      accent-color: var(--primary);
      cursor: pointer;
    }

    .controls {
      display: flex;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 22px;
    }

    .control-btn {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      border: none;
      background: var(--panel-2);
      color: var(--text);
      font-size: 1.2rem;
      cursor: pointer;
    }

    .control-btn.primary {
      width: 62px;
      height: 62px;
      background: var(--primary);
      font-size: 1.35rem;
    }

    .control-btn:hover {
      filter: brightness(1.1);
    }

    .queue-box {
      background: rgba(31, 41, 55, 0.64);
      border-radius: 18px;
      padding: 18px;
      border: 1px solid rgba(255,255,255,0.06);
    }

    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
    }

    .section-header h2 {
      margin: 0;
      font-size: 1.2rem;
    }

    .song-list {
      list-style: none;
      margin: 0;
      padding: 0;
      max-height: 360px;
      overflow: auto;
    }

    .song-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 12px 10px;
      background: rgba(15, 23, 42, 0.5);
      border: 1px solid transparent;
      border-radius: 10px;
      margin-bottom: 8px;
      cursor: pointer;
      transition: 0.2s ease;
    }

    .song-item:hover {
      border-color: rgba(167, 139, 250, 0.5);
    }

    .song-item.active {
      background: rgba(139, 92, 246, 0.18);
      border-color: rgba(139, 92, 246, 0.7);
    }

    .song-meta {
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    .song-actions {
      display: flex;
      gap: 6px;
      align-items: center;
    }

    .mini-btn {
      border: none;
      background: rgba(255,255,255,0.06);
      color: var(--text);
      border-radius: 8px;
      padding: 6px 8px;
      cursor: pointer;
      font-size: 0.8rem;
    }

    .side-panel {
      padding: 20px;
    }

    .playlist-box {
      background: rgba(31, 41, 55, 0.64);
      border-radius: 18px;
      padding: 18px;
      margin-bottom: 18px;
      border: 1px solid rgba(255,255,255,0.06);
    }

    .playlist-form {
      display: flex;
      gap: 8px;
      margin: 10px 0 8px;
    }

    .playlist-form input {
      flex: 1;
      background: rgba(15, 23, 42, 0.8);
      color: var(--text);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 10px;
      padding: 10px 12px;
      outline: none;
    }

    .playlist-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 12px;
    }

    .playlist-item {
      background: rgba(15, 23, 42, 0.5);
      border: 1px solid transparent;
      border-radius: 10px;
      padding: 10px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      transition: 0.2s ease;
    }

    .playlist-item.active {
      border-color: rgba(52, 211, 153, 0.7);
      background: rgba(52, 211, 153, 0.12);
    }

    .playlist-name {
      font-weight: 600;
    }

    .playlist-count {
      color: var(--muted);
      font-size: 0.85rem;
    }

    .playlist-detail {
      background: rgba(31, 41, 55, 0.64);
      border-radius: 18px;
      padding: 18px;
      border: 1px solid rgba(255,255,255,0.06);
    }

    .playlist-detail-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 12px;
    }

    .playlist-detail-header h3 {
      margin: 0;
      font-size: 1.1rem;
    }

    .playlist-songs {
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: 280px;
      overflow: auto;
    }

    .playlist-song {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      background: rgba(15, 23, 42, 0.5);
      border-radius: 10px;
      padding: 10px;
    }

    .playlist-song .name {
      flex: 1;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    .small-actions {
      display: flex;
      gap: 6px;
    }

    .muted {
      color: var(--muted);
    }

    @media (max-width: 900px) {
      .layout {
        grid-template-columns: 1fr;
      }

      .main-panel { border-right: none; border-bottom: 1px solid rgba(255,255,255,0.08); }
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="topbar">
      <div class="title">Music Player</div>
      <div class="upload-wrap">
        <label class="file-btn" for="fileInput">Upload Music</label>
        <input id="fileInput" type="file" accept="audio/*" multiple hidden />
      </div>
    </div>

    <div class="layout">
      <div class="main-panel">
        <div class="player-card">
          <div class="cover">♫</div>
          <div class="song-title" id="songTitle">No track loaded</div>
          <div class="song-sub" id="songArtist">Upload music to begin</div>

          <div class="progress-wrap">
            <div class="time-row">
              <span id="currentTime">0:00</span>
              <span id="duration">0:00</span>
            </div>
            <input id="seekBar" type="range" min="0" max="100" value="0" />
          </div>

          <div class="controls">
            <button class="control-btn" id="prevBtn" title="Previous">⏮</button>
            <button class="control-btn primary" id="playBtn" title="Play/Pause">▶</button>
            <button class="control-btn" id="nextBtn" title="Next">⏭</button>
            <button class="control-btn" id="shuffleBtn" title="Shuffle">🔀</button>
            <button class="control-btn" id="loopBtn" title="Loop current song">🔁</button>
          </div>
        </div>

        <div class="queue-box">
          <div class="section-header">
            <h2>Queue</h2>
            <button class="btn secondary" id="clearQueueBtn" type="button">Clear</button>
          </div>

          <ul class="song-list" id="songList"></ul>
        </div>
      </div>

      <div class="side-panel">
        <div class="playlist-box">
          <div class="section-header">
            <h2>Playlists</h2>
          </div>

          <div class="playlist-form">
            <input id="playlistNameInput" type="text" placeholder="New playlist name" />
            <button class="btn" id="createPlaylistBtn" type="button">Create</button>
          </div>

          <div class="playlist-list" id="playlistList"></div>
        </div>

        <div class="playlist-detail">
          <div class="playlist-detail-header">
            <h3 id="selectedPlaylistTitle">No playlist selected</h3>
            <button class="btn secondary" id="sortPlaylistBtn" type="button">Sort A-Z</button>
          </div>

          <div class="playlist-songs" id="playlistSongs"></div>
        </div>
      </div>
    </div>
  </div>

  <audio id="audioPlayer"></audio>

  <script>
    const fileInput = document.getElementById("fileInput");
    const audio = document.getElementById("audioPlayer");
    const songTitle = document.getElementById("songTitle");
    const songArtist = document.getElementById("songArtist");
    const currentTimeEl = document.getElementById("currentTime");
    const durationEl = document.getElementById("duration");
    const seekBar = document.getElementById("seekBar");
    const playBtn = document.getElementById("playBtn");
    const prevBtn = document.getElementById("prevBtn");
    const nextBtn = document.getElementById("nextBtn");
    const shuffleBtn = document.getElementById("shuffleBtn");
    const loopBtn = document.getElementById("loopBtn");
    const songListEl = document.getElementById("songList");
    const playlistListEl = document.getElementById("playlistList");
    const playlistSongsEl = document.getElementById("playlistSongs");
    const playlistNameInput = document.getElementById("playlistNameInput");
    const createPlaylistBtn = document.getElementById("createPlaylistBtn");
    const selectedPlaylistTitle = document.getElementById("selectedPlaylistTitle");
    const sortPlaylistBtn = document.getElementById("sortPlaylistBtn");
    const clearQueueBtn = document.getElementById("clearQueueBtn");

    let songs = [];
    let currentIndex = -1;
    let shuffleEnabled = false;
    let loopEnabled = false;
    let selectedPlaylistId = null;
    let playlists = [];

    function escapeHtml(text) {
      return text.replace(/[&<>"']/g, char => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#039;'
      }[char]));
    }

    function formatTime(seconds) {
      if (!Number.isFinite(seconds) || seconds < 0) return "0:00";
      const mins = Math.floor(seconds / 60);
      const secs = Math.floor(seconds % 60);
      return `${mins}:${String(secs).padStart(2, "0")}`;
    }

    function generateId(prefix) {
      return `${prefix}-${Date.now()}-${Math.random().toString(16).slice(2, 8)}`;
    }

    function getCurrentSong() {
      return songs[currentIndex] || null;
    }

    function updatePlayButton() {
      playBtn.textContent = audio.paused ? "▶" : "❚❚";
    }

    function renderSongList() {
      songListEl.innerHTML = "";
      if (!songs.length) {
        songListEl.innerHTML = `<li class="muted">No music uploaded yet.</li>`;
        return;
      }

      songs.forEach((song, index) => {
        const li = document.createElement("li");
        li.className = "song-item" + (index === currentIndex ? " active" : "");
        li.innerHTML = `
          <div class="song-meta">${escapeHtml(song.name)}</div>
          <div class="song-actions">
            <button class="mini-btn" data-action="play" data-index="${index}">Play</button>
            <button class="mini-btn" data-action="add" data-index="${index}">Add</button>
          </div>
        `;
        li.addEventListener("click", (event) => {
          if (event.target.tagName === "BUTTON") return;
          playSong(index);
        });
        songListEl.appendChild(li);
      });
    }

    function renderPlaylists() {
      playlistListEl.innerHTML = "";

      if (!playlists.length) {
        playlistListEl.innerHTML = "<div class='muted'>No playlists yet.</div>";
        return;
      }

      playlists.forEach(playlist => {
        const item = document.createElement("div");
        item.className = "playlist-item" + (playlist.id === selectedPlaylistId ? " active" : "");
        item.innerHTML = `
          <div>
            <div class="playlist-name">${escapeHtml(playlist.name)}</div>
            <div class="playlist-count">${playlist.songs.length} songs</div>
          </div>
          <button class="mini-btn" data-playlist-delete="${playlist.id}">Delete</button>
        `;
        item.addEventListener("click", (event) => {
          if (event.target.dataset.playlistDelete) {
            deletePlaylist(playlist.id);
            return;
          }
          selectPlaylist(playlist.id);
        });
        playlistListEl.appendChild(item);
      });
    }

    function renderPlaylistDetail() {
      if (!selectedPlaylistId) {
        selectedPlaylistTitle.textContent = "No playlist selected";
        playlistSongsEl.innerHTML = "<div class='muted'>Select a playlist to view songs.</div>";
        return;
      }

      const playlist = playlists.find(p => p.id === selectedPlaylistId);
      if (!playlist) {
        selectedPlaylistId = null;
        renderPlaylistDetail();
        return;
      }

      selectedPlaylistTitle.textContent = playlist.name;
      playlistSongsEl.innerHTML = "";

      if (!playlist.songs.length) {
        playlistSongsEl.innerHTML = "<div class='muted'>This playlist is empty.</div>";
        return;
      }

      playlist.songs.forEach((songId, index) => {
        const song = songs.find(s => s.id === songId);
        if (!song) return;

        const row = document.createElement("div");
        row.className = "playlist-song";

        row.innerHTML = `
          <div class="name">${escapeHtml(song.name)}</div>
          <div class="small-actions">
            <button class="mini-btn" data-playlist-play="${song.id}">Play</button>
            <button class="mini-btn" data-playlist-up="${song.id}">↑</button>
            <button class="mini-btn" data-playlist-down="${song.id}">↓</button>
            <button class="mini-btn" data-playlist-remove="${song.id}">Remove</button>
          </div>
        `;

        row.addEventListener("click", (event) => {
          const target = event.target;
          if (target.dataset.playlistPlay) {
            const targetSong = songs.find(s => s.id === song.id);
            if (targetSong) {
              const realIndex = songs.indexOf(targetSong);
              if (realIndex !== -1) playSong(realIndex);
            }
            return;
          }

          if (target.dataset.playlistUp) moveSongInPlaylist(song.id, -1);
          if (target.dataset.playlistDown) moveSongInPlaylist(song.id, 1);
          if (target.dataset.playlistRemove) removeSongFromPlaylist(song.id);
        });

        playlistSongsEl.appendChild(row);
      });
    }

    function selectPlaylist(id) {
      selectedPlaylistId = id;
      renderPlaylists();
      renderPlaylistDetail();
    }

    function createPlaylist() {
      const name = playlistNameInput.value.trim();
      if (!name) {
        alert("Playlist name cannot be empty.");
        return;
      }

      const exists = playlists.some(p => p.name.toLowerCase() === name.toLowerCase());
      if (exists) {
        alert("A playlist with that name already exists.");
        return;
      }

      const playlist = {
        id: generateId("playlist"),
        name,
        songs: []
      };

      playlists.push(playlist);
      playlistNameInput.value = "";
      selectedPlaylistId = playlist.id;
      renderPlaylists();
      renderPlaylistDetail();
    }

    function deletePlaylist(id) {
      if (selectedPlaylistId === id) selectedPlaylistId = null;
      playlists = playlists.filter(p => p.id !== id);
      renderPlaylists();
      renderPlaylistDetail();
    }

    function addSongToPlaylist(songId, playlistId) {
      const playlist = playlists.find(p => p.id === playlistId);
      if (!playlist) return;
      if (!playlist.songs.includes(songId)) playlist.songs.push(songId);
      renderPlaylistDetail();
      renderPlaylists();
    }

    function removeSongFromPlaylist(songId) {
      if (!selectedPlaylistId) return;
      const playlist = playlists.find(p => p.id === selectedPlaylistId);
      if (!playlist) return;

      playlist.songs = playlist.songs.filter(id => id !== songId);
      renderPlaylistDetail();
      renderPlaylists();
    }

    function moveSongInPlaylist(songId, direction) {
      const playlist = playlists.find(p => p.id === selectedPlaylistId);
      if (!playlist) return;

      const index = playlist.songs.indexOf(songId);
      if (index === -1) return;

      const nextIndex = index + direction;
      if (nextIndex < 0 || nextIndex >= playlist.songs.length) return;

      const [moved] = playlist.songs.splice(index, 1);
      playlist.songs.splice(nextIndex, 0, moved);
      renderPlaylistDetail();
    }

    function sortPlaylistAZ() {
      if (!selectedPlaylistId) return;

      const playlist = playlists.find(p => p.id === selectedPlaylistId);
      if (!playlist) return;

      const sorted = [...playlist.songs].sort((a, b) => {
        const songA = songs.find(s => s.id === a);
        const songB = songs.find(s => s.id === b);
        if (!songA || !songB) return 0;
        return songA.name.localeCompare(songB.name);
      });

      playlist.songs = sorted;
      renderPlaylistDetail();
    }

    function playSong(index) {
      if (index < 0 || index >= songs.length) return;
      currentIndex = index;
      const song = songs[index];
      audio.src = song.src;
      audio.load();
      audio.play();
      songTitle.textContent = song.name;
      songArtist.textContent = `${song.name}`;
      renderSongList();
      updatePlayButton();
    }

    function togglePlayPause() {
      if (!songs.length) return;
      if (currentIndex === -1) {
        playSong(0);
        return;
      }
      if (audio.paused) {
        audio.play();
      } else {
        audio.pause();
      }
      updatePlayButton();
    }

    function playNext() {
      if (!songs.length) return;
      if (songs.length === 1) {
        playSong(0);
        return;
      }

      if (shuffleEnabled) {
        let possible = [...Array(songs.length).keys()];
        possible = possible.filter(i => i !== currentIndex);
        const randomIndex = possible[Math.floor(Math.random() * possible.length)];
        playSong(randomIndex);
        return;
      }

      const next = (currentIndex + 1) % songs.length;
      playSong(next);
    }

    function playPrevious() {
      if (!songs.length) return;
      if (songs.length === 1) {
        playSong(0);
        return;
      }

      if (shuffleEnabled) {
        let possible = [...Array(songs.length).keys()];
        possible = possible.filter(i => i !== currentIndex);
        const randomIndex = possible[Math.floor(Math.random() * possible.length)];
        playSong(randomIndex);
        return;
      }

      const prev = (currentIndex - 1 + songs.length) % songs.length;
      playSong(prev);
    }

    function handleFiles(fileList) {
      const newSongs = Array.from(fileList).filter(file => file.type.startsWith("audio/"));
      if (!newSongs.length) {
        alert("No valid audio files were selected.");
        return;
      }

      newSongs.forEach(file => {
        const src = URL.createObjectURL(file);
        songs.push({
          id: generateId("song"),
          name: file.name,
          src,
          file
        });
      });

      if (currentIndex === -1) {
        currentIndex = 0;
        playSong(0);
      } else {
        renderSongList();
      }

      renderSongList();
    }

    fileInput.addEventListener("change", (event) => {
      handleFiles(event.target.files);
      fileInput.value = "";
    });

    playBtn.addEventListener("click", togglePlayPause);
    prevBtn.addEventListener("click", playPrevious);
    nextBtn.addEventListener("click", playNext);

    shuffleBtn.addEventListener("click", () => {
      shuffleEnabled = !shuffleEnabled;
      shuffleBtn.classList.toggle("toggle-on", shuffleEnabled);
      shuffleBtn.title = shuffleEnabled ? "Shuffle on" : "Shuffle off";
    });

    loopBtn.addEventListener("click", () => {
      loopEnabled = !loopEnabled;
      audio.loop = loopEnabled;
      loopBtn.classList.toggle("toggle-on", loopEnabled);
      loopBtn.title = loopEnabled ? "Loop current song on" : "Loop current song off";
    });

    audio.addEventListener("timeupdate", () => {
      if (!audio.duration || Number.isNaN(audio.duration)) {
        seekBar.value = 0;
        return;
      }

      const progress = (audio.currentTime / audio.duration) * 100;
      seekBar.value = progress;
      currentTimeEl.textContent = formatTime(audio.currentTime);
      durationEl.textContent = formatTime(audio.duration);
    });

    seekBar.addEventListener("input", () => {
      if (!audio.duration) return;
      const pct = Number(seekBar.value);
      audio.currentTime = (pct / 100) * audio.duration;
    });

    audio.addEventListener("ended", () => {
      if (loopEnabled) {
        audio.currentTime = 0;
        audio.play();
        return;
      }
      playNext();
    });

    audio.addEventListener("play", updatePlayButton);
    audio.addEventListener("pause", updatePlayButton);
    audio.addEventListener("loadedmetadata", () => {
      if (getCurrentSong()) {
        songTitle.textContent = getCurrentSong().name;
        songArtist.textContent = "Now playing";
      }
      durationEl.textContent = formatTime(audio.duration);
    });

    createPlaylistBtn.addEventListener("click", createPlaylist);
    playlistNameInput.addEventListener("keydown", (event) => {
      if (event.key === "Enter") createPlaylist();
    });

    sortPlaylistBtn.addEventListener("click", sortPlaylistAZ);
    clearQueueBtn.addEventListener("click", () => {
      songs = [];
      currentIndex = -1;
      audio.pause();
      audio.src = "";
      songTitle.textContent = "No track loaded";
      songArtist.textContent = "Upload music to begin";
      currentTimeEl.textContent = "0:00";
      durationEl.textContent = "0:00";
      seekBar.value = 0;
      renderSongList();
      updatePlayButton();
    });

    songListEl.addEventListener("click", (event) => {
      const button = event.target.closest("button");
      if (!button) return;

      const index = Number(button.dataset.index);
      const action = button.dataset.action;

      if (action === "play") {
        playSong(index);
      } else if (action === "add") {
        if (!selectedPlaylistId) {
          alert("Choose a playlist first.");
          return;
        }
        addSongToPlaylist(songs[index].id, selectedPlaylistId);
      }
    });

    renderSongList();
    renderPlaylists();
    renderPlaylistDetail();
    updatePlayButton();
  </script>
</body>
</html>
