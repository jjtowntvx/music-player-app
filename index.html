<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Music Player</title>
<style>
:root{--bg:#0f172a;--panel:#111827;--panel2:#1f2937;--primary:#8b5cf6;--text:#e5e7eb;--muted:#94a3b8;--success:#34d399}*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:linear-gradient(135deg,var(--bg),#1e293b);color:var(--text);min-height:100vh;display:grid;place-items:center;padding:24px}.app{width:min(1200px,100%);background:#111827e8;border:1px solid #ffffff14;border-radius:18px;overflow:hidden;box-shadow:0 20px 60px #00000059}.topbar{display:flex;justify-content:space-between;align-items:center;padding:18px 22px;background:#0f172ae6;border-bottom:1px solid #ffffff14}.title{font-size:1.4rem;font-weight:700}.upload-wrap,.controls,.status{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.btn,.file-btn{border:0;border-radius:10px;background:var(--primary);color:#fff;padding:10px 16px;font-weight:600;cursor:pointer}.btn:hover,.file-btn:hover{filter:brightness(1.15)}.btn.secondary,.control-btn{background:var(--panel2);color:var(--text)}.btn.toggle-on,.control-btn.toggle-on{background:var(--success);color:#052e1b}.layout{display:grid;grid-template-columns:1.4fr .8fr;min-height:700px}.main-panel{border-right:1px solid #ffffff14;padding:20px}.player-card,.queue-box,.playlist-box,.playlist-detail{background:#1f2937a3;border-radius:18px;padding:18px;border:1px solid #ffffff0f}.player-card{padding:22px;margin-bottom:18px}.cover{width:min(260px,100%);aspect-ratio:1;margin:0 auto 18px;border-radius:18px;display:grid;place-items:center;background:linear-gradient(135deg,#312e81,var(--primary));font-size:3rem}.song-title{text-align:center;font-size:clamp(1.3rem,2vw,2rem);font-weight:700}.song-sub{text-align:center;color:var(--muted);margin:6px 0 18px;min-height:22px}.time-row,.section-header,.playlist-detail-header{display:flex;justify-content:space-between;align-items:center}.time-row{color:var(--muted);font-size:.9rem;margin-bottom:8px}input[type=range]{width:100%;accent-color:var(--primary);cursor:pointer}.controls{justify-content:center;margin-top:22px}.control-btn{width:52px;height:52px;border:0;border-radius:50%;font-size:1.2rem;cursor:pointer}.control-btn.primary{width:62px;height:62px;background:var(--primary);font-size:1.35rem}.status{justify-content:center;margin-top:15px}.status span{border-radius:999px;padding:5px 10px;background:#0f172a;color:var(--muted);font-size:.8rem}.status span.on{background:#34d3992e;color:var(--success)}.section-header h2{margin:0;font-size:1.2rem}.song-list,.playlist-list{list-style:none;margin:14px 0 0;padding:0}.song-list{max-height:360px;overflow:auto}.song-item,.playlist-item,.playlist-song{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px;background:#0f172a80;border:1px solid transparent;border-radius:10px;margin-bottom:8px}.song-item{cursor:pointer}.song-item.active,.playlist-item.active{background:#8b5cf62e;border-color:#8b5cf6b3}.song-meta,.name{overflow:hidden;white-space:nowrap;text-overflow:ellipsis}.song-actions,.small-actions{display:flex;gap:6px}.mini-btn{border:0;background:#ffffff0f;color:var(--text);border-radius:8px;padding:6px 8px;cursor:pointer;font-size:.8rem}.side-panel{padding:20px}.playlist-box{margin-bottom:18px}.playlist-form{display:flex;gap:8px;margin:10px 0}.playlist-form input{flex:1;background:#0f172acc;color:var(--text);border:1px solid #ffffff14;border-radius:10px;padding:10px 12px}.playlist-name{font-weight:600}.playlist-count,.muted{color:var(--muted);font-size:.85rem}.playlist-songs{max-height:280px;overflow:auto}.playlist-song .name{flex:1}@media(max-width:900px){.layout{grid-template-columns:1fr}.main-panel{border-right:0;border-bottom:1px solid #ffffff14}}
</style>
</head>
<body><div class="app"><div class="topbar"><div class="title">Music Player</div><div class="upload-wrap"><label class="file-btn" for="fileInput">Upload Music</label><input id="fileInput" type="file" accept="audio/*" multiple hidden></div></div><div class="layout"><main class="main-panel"><div class="player-card"><div class="cover">♫</div><div class="song-title" id="songTitle">No track loaded</div><div class="song-sub" id="songArtist">Upload music to begin</div><div><div class="time-row"><span id="currentTime">0:00</span><span id="duration">0:00</span></div><input id="seekBar" type="range" min="0" max="100" value="0"></div><div class="controls"><button class="control-btn" id="prevBtn" title="Previous">⏮</button><button class="control-btn primary" id="playBtn" title="Play/Pause">▶</button><button class="control-btn" id="nextBtn" title="Next">⏭</button><button class="control-btn" id="shuffleBtn" title="Shuffle">🔀</button><button class="control-btn" id="repeatTrackBtn" title="Repeat current song">🔁</button><button class="control-btn" id="repeatAllBtn" title="Repeat all songs">🔂</button></div><div class="status" aria-live="polite"><span id="shuffleStatus">Shuffle: Off</span><span id="repeatTrackStatus">Repeat song: Off</span><span id="repeatAllStatus">Repeat all: Off</span></div></div><div class="queue-box"><div class="section-header"><h2>Queue</h2><button class="btn secondary" id="clearQueueBtn">Clear</button></div><ul class="song-list" id="songList"></ul></div></main><aside class="side-panel"><div class="playlist-box"><div class="section-header"><h2>Playlists</h2></div><div class="playlist-form"><input id="playlistNameInput" placeholder="New playlist name"><button class="btn" id="createPlaylistBtn">Create</button></div><div class="playlist-list" id="playlistList"></div></div><div class="playlist-detail"><div class="playlist-detail-header"><h3 id="selectedPlaylistTitle">No playlist selected</h3><button class="btn secondary" id="sortPlaylistBtn">Sort A-Z</button></div><div class="playlist-songs" id="playlistSongs"></div></div></aside></div></div><audio id="audioPlayer"></audio>
<script>
const $=id=>document.getElementById(id),fileInput=$("fileInput"),audio=$("audioPlayer"),songList=$("songList"),playlistList=$("playlistList"),playlistSongs=$("playlistSongs");let songs=[],current=-1,shuffle=false,repeatTrack=false,repeatAll=false,playlists=[],selected=null;
const title=$("songTitle"),artist=$("songArtist"),play=$("playBtn"),seek=$("seekBar"),now=$("currentTime"),duration=$("duration");
const esc=s=>s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));const id=p=>p+'-'+Date.now()+'-'+Math.random().toString(16).slice(2);const time=s=>Number.isFinite(s)?`${Math.floor(s/60)}:${String(Math.floor(s%60)).padStart(2,'0')}`:'0:00';
function updateModes(){[[$("shuffleBtn"),shuffle,$("shuffleStatus"),'Shuffle'],[$("repeatTrackBtn"),repeatTrack,$("repeatTrackStatus"),'Repeat song'],[$("repeatAllBtn),repeatAll,$("repeatAllStatus"),'Repeat all']].forEach(([b,on,label])=>{b.classList.toggle('toggle-on',on);$(label==='Shuffle'?'shuffleStatus':label==='Repeat song'?'repeatTrackStatus':'repeatAllStatus').textContent=label+': '+(on?'On':'Off');});}
function renderSongs(){songList.innerHTML=songs.length?songs.map((s,i)=>`<li class="song-item ${i===current?'active':''}" data-i="${i}"><span class="song-meta">${esc(s.name)}</span><span class="song-actions"><button class="mini-btn" data-action="play">Play</button><button class="mini-btn" data-action="add">Add</button></span></li>`).join(''):'<li class="muted">No music uploaded yet.</li>';}
function renderPlaylists(){playlistList.innerHTML=playlists.length?playlists.map(p=>`<div class="playlist-item ${p.id===selected?'active':''}" data-p="${p.id}"><div><div class="playlist-name">${esc(p.name)}</div><div class="playlist-count">${p.songs.length} songs</div></div><button class="mini-btn" data-delete="1">Delete</button></div>`).join(''):'<div class="muted">No playlists yet.</div>';renderDetail();}
function renderDetail(){let p=playlists.find(x=>x.id===selected);$("selectedPlaylistTitle").textContent=p?p.name:'No playlist selected';playlistSongs.innerHTML=p&&p.songs.length?p.songs.map((sid,i)=>{let s=songs.find(x=>x.id===sid);return s?`<div class="playlist-song"><span class="name">${esc(s.name)}</span><span class="small-actions"><button class="mini-btn" data-play="${sid}">Play</button><button class="mini-btn" data-move="-1">↑</button><button class="mini-btn" data-move="1">↓</button><button class="mini-btn" data-remove="1">Remove</button></span></div>`:''}).join(''):(p?'<div class="muted">This playlist is empty.</div>':'<div class="muted">Select a playlist to view songs.</div>');}
function playSong(i){if(!songs[i])return;current=i;audio.src=songs[i].src;audio.play();title.textContent=songs[i].name;artist.textContent='Now playing';renderSongs();}
function next(){if(!songs.length)return;if(repeatTrack){audio.currentTime=0;audio.play();return}if(songs.length===1){if(repeatAll)playSong(0);return}if(!repeatAll&&current===songs.length-1){audio.pause();return}let i=shuffle?Math.floor(Math.random()*songs.length):(current+1)%songs.length;if(shuffle&&i===current)i=(i+1)%songs.length;playSong(i)}
fileInput.onchange=e=>{[...e.target.files].filter(f=>f.type.startsWith('audio/')).forEach(f=>songs.push({id:id('song'),name:f.name,src:URL.createObjectURL(f)}));if(current<0&&songs.length)playSong(0);renderSongs();e.target.value=''};
play.onclick=()=>{if(!songs.length)return;if(current<0)playSong(0);else audio.paused?audio.play():audio.pause()};$("nextBtn").onclick=next;$("prevBtn").onclick=()=>{if(songs.length)playSong((current-1+songs.length)%songs.length)};
$("shuffleBtn").onclick=()=>{shuffle=!shuffle;updateModes()};$("repeatTrackBtn").onclick=()=>{repeatTrack=!repeatTrack;if(repeatTrack)repeatAll=false;updateModes()};$("repeatAllBtn").onclick=()=>{repeatAll=!repeatAll;if(repeatAll)repeatTrack=false;updateModes()};
audio.onplay=()=>play.textContent='❚❚';audio.onpause=()=>play.textContent='▶';audio.ontimeupdate=()=>{seek.value=audio.duration?(audio.currentTime/audio.duration)*100:0;now.textContent=time(audio.currentTime);duration.textContent=time(audio.duration)};audio.onloadedmetadata=()=>duration.textContent=time(audio.duration);audio.onended=next;seek.oninput=()=>{if(audio.duration)audio.currentTime=seek.value/100*audio.duration};
$("createPlaylistBtn").onclick=()=>{let name=$("playlistNameInput").value.trim();if(!name)return;if(playlists.some(p=>p.name.toLowerCase()===name.toLowerCase()))return alert('A playlist with that name already exists.');let p={id:id('playlist'),name,songs:[]};playlists.push(p);selected=p.id;$("playlistNameInput").value='';renderPlaylists()};$("playlistNameInput").onkeydown=e=>{if(e.key==='Enter')$("createPlaylistBtn").click()};
playlistList.onclick=e=>{let row=e.target.closest('[data-p]');if(!row)return;let p=playlists.find(x=>x.id===row.dataset.p);if(e.target.dataset.delete){playlists=playlists.filter(x=>x!==p);if(selected===p.id)selected=null}else selected=p.id;renderPlaylists()};
songList.onclick=e=>{let row=e.target.closest('[data-i]');if(!row)return;let s=songs[+row.dataset.i];if(e.target.dataset.action==='add'){let p=playlists.find(x=>x.id===selected);if(!p)return alert('Choose a playlist first.');if(!p.songs.includes(s.id))p.songs.push(s.id);renderPlaylists()}else playSong(+row.dataset.i)};
playlistSongs.onclick=e=>{let row=e.target.closest('.playlist-song'),p=playlists.find(x=>x.id===selected);if(!row||!p)return;let sid=row.querySelector('[data-play],[data-remove]')?.dataset.play||p.songs.find(x=>songs.find(s=>s.id===x&&s.name===row.querySelector('.name').textContent));let index=p.songs.indexOf(sid);if(e.target.dataset.play){let i=songs.findIndex(s=>s.id===sid);if(i>=0)playSong(i)}else if(e.target.dataset.remove)p.songs.splice(index,1);else if(e.target.dataset.move){let n=index+ +e.target.dataset.move;if(n>=0&&n<p.songs.length)[p.songs[index],p.songs[n]]=[p.songs[n],p.songs[index]]}renderPlaylists()};
$("sortPlaylistBtn").onclick=()=>{let p=playlists.find(x=>x.id===selected);if(p)p.songs.sort((a,b)=>(songs.find(s=>s.id===a)?.name||'').localeCompare(songs.find(s=>s.id===b)?.name||''));renderDetail()};$("clearQueueBtn").onclick=()=>{songs=[];current=-1;audio.pause();audio.src='';title.textContent='No track loaded';artist.textContent='Upload music to begin';now.textContent=duration.textContent='0:00';renderSongs();};renderSongs();renderPlaylists();updateModes();
</script></body></html>
